name = "khabo-ki-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Secrets (set with `npx wrangler secret put <NAME>`, never written here):
#   GEMINI_API_KEY  — Google AI Studio key
#   APP_KEY         — shared key the app sends in X-App-Key

[vars]
GEMINI_MODEL = "gemini-3.6-flash"

# Per-device: 5 scans per minute. Per-IP: 20 per minute.
[[ratelimits]]
name = "DEVICE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[observability]
enabled = false
